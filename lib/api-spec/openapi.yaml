openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Stockpile volume measurement API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: jobs
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List user's stockpile measurement jobs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new stockpile measurement job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /jobs/{id}/polygon:
    patch:
      operationId: setJobPolygon
      tags: [jobs]
      summary: Save a manually drawn polygon and compute volume from it
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [polygonCoordinates]
              properties:
                polygonCoordinates:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
  /jobs/{id}/refresh:
    post:
      operationId: refreshJob
      tags: [jobs]
      summary: Poll WebODM for the latest task status and update the job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Aggregate stats across all of the user's jobs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent job activity feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    MaterialType:
      type: string
      enum: [sand, soil, coal]
    SourceType:
      type: string
      enum: [drone, smartphone, dslr]
    PrecisionLevel:
      type: string
      enum: [low, medium, high]
    PolygonMode:
      type: string
      enum: [automatic, manual]
    JobStatus:
      type: string
      enum: [queued, running, completed, failed]
    UploadedImage:
      type: object
      required: [name, sizeBytes, accepted]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
        accepted:
          type: boolean
        rejectionReason:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        sharpnessScore:
          type: number
          nullable: true
    CreateJobBody:
      type: object
      required: [name, materialType, sourceType, images]
      properties:
        name:
          type: string
        materialType:
          $ref: "#/components/schemas/MaterialType"
        sourceType:
          $ref: "#/components/schemas/SourceType"
        precisionLevel:
          $ref: "#/components/schemas/PrecisionLevel"
        notes:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/UploadedImage"
        gcpFile:
          type: object
          nullable: true
          required: [name, content]
          properties:
            name:
              type: string
            content:
              type: string
              description: Plain-text contents of gcp_list.txt
        totalFileSizeBytes:
          type: integer
          nullable: true
          description: Sum of source image file sizes computed client-side.
        captureLocation:
          type: string
          nullable: true
          description: Free-form location label (e.g. "31.4N, 2.7E")
        captureDate:
          type: string
          format: date-time
          nullable: true
          description: Capture timestamp from EXIF or operator input.
        polygonMode:
          $ref: "#/components/schemas/PolygonMode"
    Job:
      type: object
      required:
        - id
        - name
        - materialType
        - sourceType
        - precisionLevel
        - polygonMode
        - status
        - progress
        - gcpEnabled
        - imageCount
        - acceptedImageCount
        - createdAt
        - updatedAt
        - images
      properties:
        id:
          type: string
        name:
          type: string
        materialType:
          $ref: "#/components/schemas/MaterialType"
        sourceType:
          $ref: "#/components/schemas/SourceType"
        precisionLevel:
          $ref: "#/components/schemas/PrecisionLevel"
        polygonMode:
          $ref: "#/components/schemas/PolygonMode"
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: integer
          description: 0-100
        webodmTaskId:
          type: string
          nullable: true
        volumeM3:
          type: number
          nullable: true
        areaSqm:
          type: number
          nullable: true
        orthophotoUrl:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        gcpEnabled:
          type: boolean
        gcpFileName:
          type: string
          nullable: true
          description: Original filename of the uploaded GCP file (e.g. gcp_list.txt)
        webodmGcpUrl:
          type: string
          nullable: true
        totalFileSizeBytes:
          type: integer
          nullable: true
        captureLocation:
          type: string
          nullable: true
        captureDate:
          type: string
          format: date-time
          nullable: true
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
        processingDurationSeconds:
          type: integer
          nullable: true
        polygonCoordinates:
          type: array
          nullable: true
          items:
            type: array
            items:
              type: number
        imageCount:
          type: integer
        acceptedImageCount:
          type: integer
        images:
          type: array
          items:
            $ref: "#/components/schemas/UploadedImage"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    MaterialBreakdown:
      type: object
      required: [materialType, jobCount, totalVolumeM3]
      properties:
        materialType:
          $ref: "#/components/schemas/MaterialType"
        jobCount:
          type: integer
        totalVolumeM3:
          type: number
    StatusBreakdown:
      type: object
      required: [status, count]
      properties:
        status:
          $ref: "#/components/schemas/JobStatus"
        count:
          type: integer
    DashboardSummary:
      type: object
      required:
        - totalJobs
        - totalVolumeM3
        - completedJobs
        - activeJobs
        - totalImages
        - byMaterial
        - byStatus
      properties:
        totalJobs:
          type: integer
        totalVolumeM3:
          type: number
        completedJobs:
          type: integer
        activeJobs:
          type: integer
        averageVolumeM3:
          type: number
          nullable: true
        totalImages:
          type: integer
        averageProcessingDurationSeconds:
          type: integer
          nullable: true
        byMaterial:
          type: array
          items:
            $ref: "#/components/schemas/MaterialBreakdown"
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusBreakdown"
    ActivityItem:
      type: object
      required: [id, jobId, jobName, materialType, status, createdAt, imageCount]
      properties:
        id:
          type: string
        jobId:
          type: string
        jobName:
          type: string
        materialType:
          $ref: "#/components/schemas/MaterialType"
        status:
          $ref: "#/components/schemas/JobStatus"
        volumeM3:
          type: number
          nullable: true
        imageCount:
          type: integer
        processingDurationSeconds:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
