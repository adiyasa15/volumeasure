kind = "web"
previewPath = "/"
title = "Stockpile Volume Measurement"
version = "1.0.0"
id = "artifacts/stockpile"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18296

[services.development]
run = "pnpm --filter @workspace/stockpile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stockpile", "run", "build" ]
publicDir = "artifacts/stockpile/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18296"
BASE_PATH = "/"
